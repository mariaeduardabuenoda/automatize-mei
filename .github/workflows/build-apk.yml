name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          API_URL: ${{ secrets.API_URL }}
        run: flutter build apk --release --android-skip-build-dependency-validation --dart-define="API_URL=$API_URL"
        
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: automatize-mei-android-apk
          path: app_flutter/build/app/outputs/flutter-apk/app-release.apk
